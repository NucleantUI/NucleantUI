# Every example as an app target of one Xcode project — the same sources
# each example's own package builds (`../<Name>/Sources/<Name>`), here for
# iOS (device and simulator) and macOS, picked by scheme. Regenerate the
# .xcodeproj after editing this:
#
#     cd Examples/xcode && xcodegen
#
# Left out: AnimatableShader and Backdrops. Their shaders are compiled by
# PyShader's build plugin, which runs for a SwiftPM target only — it has no
# `XcodeBuildToolPlugin` side for an app target to use.
name: Examples
options:
  bundleIdPrefix: org.nucleantui
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  # NucleantUI's Package.swift is the source of truth for both minimums.
  xcodeVersion: "26.0"
  # Xcode would otherwise add a scheme per package target as well, the
  # library's `NucleantUIDemo` executable among them. Only the examples'
  # schemes are wanted.
  postGenCommand: >-
    mkdir -p Examples.xcodeproj/project.xcworkspace/xcshareddata &&
    printf '%s\n'
    '<?xml version="1.0" encoding="UTF-8"?>'
    '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
    '<plist version="1.0">'
    '<dict>'
    '	<key>IDEWorkspaceSharedSettings_AutocreateContextsIfNeeded</key>'
    '	<false/>'
    '</dict>'
    '</plist>'
    > Examples.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings

packages:
  # The enclosing checkout, as the examples' own packages take it
  # (`.package(path: "../..")`). Its Package.swift resolves the Nucleant
  # packages under it as `swift build` does — see `localDev` there.
  NucleantUI:
    path: ../..
  # Compositor's, as its Package.swift takes it from GitHub; the local
  # NucleantUI above stands in for the one it depends on.
  NucleantUI_PyShader:
    url: https://github.com/NucleantUI/NucleantUI_PyShader.git
    minorVersion: 0.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targetTemplates:
  # An example as an app: its target name is the example's, and so is its
  # product, bundle identifier and display name.
  Example:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: NucleantUI
    settings:
      base:
        PRODUCT_NAME: ${target_name}
        PRODUCT_BUNDLE_IDENTIFIER: org.nucleantui.${target_name}
        # Signing. Sign to run locally by default: that is all the simulator
        # and macOS need, and Xcode's team check reads the *unconditioned*
        # identity, so an `[sdk=macosx*]` override alone would still demand a
        # team for the Mac build. Only a real iOS device needs a certificate —
        # set the team in Xcode (Signing & Capabilities) for that. These sit
        # on the target because xcodegen's application preset puts
        # `CODE_SIGN_IDENTITY = "iPhone Developer"` there, above any
        # project-level value.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # MoltenVK / ThorVG / libomp are dynamic frameworks from the packages'
        # binary targets; Xcode embeds them here.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
        # NucleantUI's macro target (`@View`, `#viewID`) has to run at build
        # time. Xcode asks once to trust it; `xcodebuild` needs
        # `-skipMacroValidation`.
    info:
      # The same for every example; the name comes from the target.
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        # iOS. A scene manifest with no delegate class named: UIKit then asks
        # the app delegate for a configuration, and NucleantUI's
        # `_AppLaunchDelegate` answers with its own scene delegate. That is
        # what lets an example's `@main` be plain `NucleantApp` on iOS. The
        # empty UILaunchScreen is the system-generated launch screen — without
        # it iOS runs the app letterboxed at a legacy size.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # macOS.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    scheme:
      testTargets: []
      gatherCoverageData: false

  # The example package's executable target, unchanged: its `@main …:
  # NucleantApp` is the app's entry point on both platforms.
  ExampleSources:
    sources:
      - path: ../${target_name}/Sources/${target_name}

targets:
  Bookmarks:
    templates: [Example, ExampleSources]
  Calculator:
    templates: [Example, ExampleSources]
  Compositor:
    templates: [Example, ExampleSources]
    dependencies:
      - package: NucleantUI_PyShader
  Dashboard:
    templates: [Example, ExampleSources]
  Finder:
    templates: [Example, ExampleSources]
  Flashcards:
    templates: [Example, ExampleSources]
  Icons:
    templates: [Example]
    sources:
      - path: ../Icons/Sources/Icons
        excludes:
          - "Material"
          - "Material/**"
      # As the package copies it (`.copy("Material")`): one folder, its
      # category/icon layout kept, in the app's resources.
      - path: ../Icons/Sources/Icons/Material
        type: folder
        buildPhase: resources
      - path: Support/BundleModule.swift
  Issues:
    templates: [Example, ExampleSources]
  Metronome:
    templates: [Example, ExampleSources]
    dependencies:
      - package: NucleantUI
        product: NucleantAudio
  MindMap:
    templates: [Example, ExampleSources]
  Moodboard:
    templates: [Example, ExampleSources]
  Photos:
    templates: [Example, ExampleSources]
  Pomodoro:
    templates: [Example, ExampleSources]
  Reader:
    templates: [Example, ExampleSources]
  Recipes:
    templates: [Example, ExampleSources]
  Sampler:
    templates: [Example, ExampleSources]
    dependencies:
      - package: NucleantUI
        product: NucleantAudio
  Sketch:
    templates: [Example, ExampleSources]
  Slides:
    templates: [Example, ExampleSources]
  Tasks:
    templates: [Example, ExampleSources]
  TwentyFortyEight:
    templates: [Example, ExampleSources]
